<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AssetOps — IT asset management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Theme layer. These six are admin-editable; everything below derives from them
     so a colour change propagates without touching component CSS. */
  --app-primary:#1E5A78; --app-secondary:#2F6B4C; --app-text:#17222E; --app-bg:#ffffff;
  --app-font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  --app-font-size:14px; --app-font-size-sm:12px; --app-font-size-lg:18px;

  /* Fixed chrome. Deliberately not themed: the navigation rail stays legible
     whatever palette an admin picks. */
  --ground:#E7EBEF; --surface2:#F5F7F9;
  --ink:#17222E; --muted:#61717F; --line:#CFD8E0; --line2:#E2E8ED;
  --oxide:#A8442A; --oxide-l:#FAEDE9;
  --moss:#2F6B4C; --moss-l:#EAF3EE;
  --amber:#8A6614; --amber-l:#FBF2DE;
  --r:3px;

  /* Derived from the theme. Static fallbacks come first so a browser without
     color-mix() still renders sensible tints rather than dropping the rule. */
  --surface:#fff;
  --surface:var(--app-bg);
  --blue:#1E5A78;
  --blue:var(--app-primary);
  --blue-d:#164457;
  --blue-d:color-mix(in srgb, var(--app-primary) 82%, #000);
  --blue-l:#E8F0F4;
  --blue-l:color-mix(in srgb, var(--app-primary) 11%, #fff);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--app-text);
  font-family:var(--app-font-family); font-size:var(--app-font-size); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:calc(var(--app-font-size-lg) * 1.16)}
h2{font-size:var(--app-font-size-lg)}
h3{font-size:13px;color:var(--muted);font-weight:600}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{
  width:212px;flex:0 0 212px;background:#12202C;color:#B9C6D1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 16px 14px;border-bottom:1px solid #22333F}
.brand b{color:#fff;font-size:16px;display:block;letter-spacing:-.02em}
.brand img{max-height:26px;max-width:120px;object-fit:contain;display:block;margin-bottom:6px}
.brand span{font-size:11px;color:#7E8FA0;font-family:"IBM Plex Mono",monospace}
.nav{padding:8px 0;overflow-y:auto;flex:1}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:7px 16px;cursor:pointer;color:#B9C6D1;font-size:13.5px;border-left:2px solid transparent;
}
.nav button:hover{background:#1A2A38;color:#fff}
.nav button.on{background:#1A2A38;color:#fff;border-left-color:var(--blue);font-weight:500}
.nav .grp{padding:14px 16px 5px;font-size:11px;color:#6C7E8E;font-weight:500}
.nav .ct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#728496}
.railfoot{padding:10px 16px;border-top:1px solid #22333F;font-size:11px;color:#6C7E8E}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
}
.top .who{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.body{padding:20px 22px 60px;flex:1}

/* controls */
.btn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;
}
.btn:hover{border-color:#A9B7C3;background:var(--surface2)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.p:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.d{color:var(--oxide);border-color:#DFC3BA}
.btn.d:hover{background:var(--oxide-l);border-color:var(--oxide)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;width:100%;
}
textarea{resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
label.f > span i{color:var(--oxide);font-style:normal}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card > header{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card > .in{padding:14px}
.grid{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* table */
.tw{overflow:auto;max-height:none}
table{border-collapse:collapse;width:100%;font-size:var(--app-font-size-sm)}
th{
  text-align:left;font-weight:600;font-size:var(--app-font-size-sm);color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);
  position:sticky;top:0;white-space:nowrap;
}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:#F7F9FB}
tbody tr.sel{background:var(--blue-l)}
tbody tr.sel:hover{background:#DFEAF0}
td.chk,th.chk{width:32px;padding-left:12px}
.trunc{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* pills */
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.use{background:var(--moss-l);color:var(--moss)}
.pill.rep{background:var(--oxide-l);color:var(--oxide)}
.pill.spare{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.repair{background:var(--amber-l);color:var(--amber)}
.pill.retired{background:#EDEFF1;color:#7A8894}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:calc(var(--app-font-size) * 1.8);font-weight:500;letter-spacing:-.03em;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--oxide)}

/* age spine — the one bold element */
.spine{display:flex;height:52px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.spine div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#fff;min-width:0;position:relative}
.spinelegend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.spinelegend i{width:9px;height:9px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle}

/* bars */
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:9px;font-size:12.5px}
.bar .t{background:var(--blue);height:15px;border-radius:2px;min-width:2px}
.bar .n{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--muted)}

/* bulk bar */
.bulk{
  position:sticky;bottom:0;z-index:15;background:#12202C;color:#fff;
  padding:9px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-radius:var(--r);margin-top:-1px;
}
.bulk b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.bulk .btn{background:#22333F;color:#fff;border-color:#2E4150}
.bulk .btn:hover{background:#2C404E}
.bulk select{background:#22333F;border-color:#2E4150;color:#fff;width:auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(18,32,44,.42);z-index:40}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--surface);z-index:41;
  display:flex;flex-direction:column;border-left:1px solid var(--line);
}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .in{padding:18px;overflow-y:auto;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .16s ease-out}@keyframes sl{from{transform:translateX(14px);opacity:.6}}}

/* misc */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#12202C;color:#fff;padding:9px 16px;border-radius:var(--r);z-index:60;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer;color:var(--muted);font-size:13.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:500}
.kv{display:grid;grid-template-columns:132px 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:2px 9px;font-size:12px}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 0 0 4px}
@media(max-width:820px){
  .rail{position:fixed;left:-212px;z-index:50;transition:left .16s}
  .rail.open{left:0}
  .shell{display:block}
  .g2{grid-template-columns:1fr}
  .body{padding:14px}
}
@media print{.rail,.top,.bulk,.noprint{display:none!important}.body{padding:0}}

/* ---- theme settings page ---- */
.tcols{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.tcols{grid-template-columns:1fr}}
.tsticky{position:sticky;top:62px}
fieldset{border:0;padding:0;margin:0 0 18px}
fieldset:disabled{opacity:.6}
legend{font-size:12px;font-weight:600;color:var(--muted);padding:0 0 8px}
.colrow{display:flex;gap:7px;align-items:center}
.colrow input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;flex:0 0 38px}
.ferr{display:block;color:var(--oxide);font-size:12px;font-style:normal;margin-top:3px}
input[aria-invalid=true]{border-color:var(--oxide);background:var(--oxide-l)}
.twarn{background:var(--amber-l);border:1px solid #E6D4A8;color:var(--amber);border-radius:var(--r);padding:8px 10px;font-size:12.5px;margin:0 0 12px}
.alert{border-radius:var(--r);padding:9px 12px;font-size:13px;margin-bottom:14px}
.alert.e{background:var(--oxide-l);border:1px solid #DFC3BA;color:var(--oxide)}
.alert.k{background:var(--moss-l);border:1px solid #B9D7C6;color:var(--moss)}
.stage{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--app-bg);color:var(--app-text);font-family:var(--app-font-family);font-size:var(--app-font-size)}
.stage h3{font-size:var(--app-font-size-lg);margin:0 0 8px}
.stage p{margin:0 0 12px;max-width:56ch}
.stage .pbtn{background:var(--app-primary);color:#fff;border:0;padding:7px 14px;border-radius:var(--r);font-size:var(--app-font-size-sm);cursor:default}
.stage .sec{color:var(--app-secondary);margin-left:12px;font-size:var(--app-font-size-sm);font-weight:500}
.stage table{margin-top:14px}
.stage .lg{max-height:34px;max-width:150px;object-fit:contain;margin-bottom:12px;display:block}
.drop{border:1px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;background:var(--surface2)}
.drop.over{border-color:var(--blue);background:var(--blue-l)}
.logobox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface2);margin-bottom:10px}
.logobox img{max-height:44px;max-width:130px;object-fit:contain}
.logobox .meta{font-size:12px;color:var(--muted);line-height:1.5}
.logobox.pending{border-color:var(--amber);background:var(--amber-l)}
.rlog{background:#12202C;color:#C7D3DD;border-radius:var(--r);padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;max-height:210px;overflow:auto;line-height:1.7}
.rlog .m{color:#7FB3CC;font-weight:500}
.rlog .ok{color:#7CC79B}
.rlog .no{color:#E39B86}
.rlog .dim{color:#68798A}
.modal{position:fixed;inset:0;background:rgba(18,32,44,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:#fff;border-radius:4px;max-width:480px;padding:20px}
.modal p{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.55}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.dirty{font-size:12px;color:var(--amber);align-self:center}
.tests{display:grid;gap:6px}
.tests button{text-align:left;font-size:12.5px;padding:7px 10px;line-height:1.45}
</style>

      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
function csvCell(v){
  v=v==null?'':String(v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime||'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function exportAssets(list,name){
  const fx=S.fields;
  const head=['Asset tag','Serial','Type','Brand','Model','Assigned to','Department','Site','CPU','RAM','Storage','OS','Status','Vendor','Purchase price','Purchase year','Warranty end',...fx.map(f=>f.label)];
  const lines=[head.map(csvCell).join(',')];
  // Price exports as a bare number so a spreadsheet reads it as currency, not text.
  list.forEach(a=>lines.push([a.tag,a.serial,a.type,a.brand,a.model,a.user,a.dept,siteName(a.siteCode),a.cpu,a.ram,a.storage,a.os,a.status,a.vendor||'',a.purchasePrice==null?'':a.purchasePrice,a.purchaseYear,a.warrantyEnd,...fx.map(f=>(a.custom||{})[f.key]||'')].map(csvCell).join(',')));
  download(name||'assets.csv',lines.join('\n'));
}

/* ---------- filtering ---------- */
function filtered(){
  const q=F.q.trim().toLowerCase();
  let a=scopedAssets().filter(x=>{
    if(F.site&&x.siteCode!==F.site)return false;
    if(F.dept&&x.dept!==F.dept)return false;
    if(F.status&&x.status!==F.status)return false;
    if(F.type&&x.type!==F.type)return false;
    if(F.brand&&x.brand!==F.brand)return false;
    if(F.vendor&&(x.vendor||'')!==F.vendor)return false;
    if(q){
      const hay=[x.tag,x.user,x.model,x.cpu,x.serial,x.dept,x.os,x.storage,x.ram,x.vendor].join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const k=F.sort.k,d=F.sort.dir;
  a=a.slice().sort((x,y)=>{
    let vx=k==='site'?siteName(x.siteCode):x[k],vy=k==='site'?siteName(y.siteCode):y[k];
    if(typeof vx==='number'&&typeof vy==='number')return (vx-vy)*d;
    return String(vx==null?'':vx).localeCompare(String(vy==null?'':vy),undefined,{numeric:true})*d;
  });
  return a;
}
function ramGB(a){const m=String(a.ram).match(/\d+/);return m?+m[0]:0;}

}

}

/* ---------- import ---------- */
const TARGETS=[
  {k:'tag',t:'Asset tag'},{k:'serial',t:'Serial number'},{k:'type',t:'Type'},{k:'brand',t:'Make'},
  {k:'model',t:'Model'},{k:'user',t:'Assigned to'},{k:'dept',t:'Department'},{k:'siteCode',t:'Site code'},
  {k:'cpu',t:'Processor'},{k:'ram',t:'Memory'},{k:'storage',t:'Storage'},{k:'os',t:'Operating system'},
  {k:'status',t:'Status'},{k:'vendor',t:'Vendor'},{k:'purchasePrice',t:'Purchase price'},
  {k:'purchaseYear',t:'Purchase year'},{k:'warrantyEnd',t:'Warranty end'}
];
function guessMap(h){
  const s=String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  const g={
    tag:['assettag','tag','assetid','assetcode','assetno'],
    serial:['serial','serialnumber','serialno','sno'],
    siteCode:['site','sitename','sitecode','location','branch','office'],
    dept:['dept','department','division'],
    user:['username','user','assignedto','employee','name','owner','custodian'],
    type:['type','assettype','devicetype','desktopaio','category'],
    brand:['make','brand','manufacturer','oem'],
    model:['model','machine','modelno'],
    cpu:['cpu','processor','proc'],
    ram:['ram','memory'],
    storage:['storage','hdd','ssd','harddisk','hddssd','disk','harddrive'],
    os:['os','operatingsystem','windows'],
    status:['status','condition','state'],
    vendor:['vendor','supplier','vendorname','suppliername','purchasedfrom','boughtfrom','dealer','seller','party'],
    purchasePrice:['price','purchaseprice','cost','amount','rate','value','invoiceamount','purchasecost'],
    purchaseYear:['purchaseyear','year','purchased','purchasedate','buyyear'],
    warrantyEnd:['warrantyend','warranty','amcend','expiry','warrantyexpiry']
  };
  // vendor is matched before user: a column headed "supplier name" ends in "name",
  // which would otherwise be read as the person the asset is assigned to.
  const order=['tag','serial','siteCode','dept','vendor','purchasePrice','user','type','brand','model','cpu','ram','storage','os','status','purchaseYear','warrantyEnd'];
  for(const k of order)if(g[k].some(x=>s===x))return k;
  for(const k of order)if(g[k].some(x=>x.length>3&&s.includes(x)))return k;
  return '';
}

          <select id="idefsite">${S.sites.map(s=>`<option value="${s.code}">${esc(s.name)}</option>`).join('')}</select></label>
        <div class="note" style="margin-bottom:12px">Rows whose asset tag already exists will update that asset instead of creating a duplicate.</div>
        <h3 style="margin-bottom:6px">Preview</h3>

          <tbody>${rows.slice(0,5).map(r=>`<tr>${head.map((_,i)=>`<td><span class="trunc">${esc(r[i]||'')}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="row"><button class="btn p" id="idoit">Import ${rows.length} rows</button><button class="btn" id="icancel">Cancel</button></div>
      </div>
    </div>`;
    $('#icancel').onclick=()=>{IMPORTED=null;$('#imapping').innerHTML='';};
    $('#idoit').onclick=doImport;
  }
  function doImport(){
    const {head,rows}=IMPORTED;
    const map=[...document.querySelectorAll('[data-map]')].map(s=>s.value);
    if(!map.some(m=>m==='user'||m==='tag')){toast('Match at least an asset tag or an assigned-to column');return;}
    const r=applyImport(rows,map,$('#idefsite').value);
    logit('Imported',r.created+' created, '+r.updated+' updated');
    IMPORTED=null;save();VIEW='assets';F={...F,q:'',page:1};render();
    toast(r.created+' added, '+r.updated+' updated');
  }
}

/* ---------- import engine (testable) ---------- */
function applyImport(rows,map,defSite){
  const siteByName={};S.sites.forEach(s=>{siteByName[s.code.toLowerCase()]=s.code;siteByName[s.name.toLowerCase()]=s.code;});
  let created=0,updated=0,skipped=0;
  rows.forEach(r=>{
    const rec={custom:{}};
    map.forEach((m,i)=>{
      if(!m)return;
      const val=String(r[i]==null?'':r[i]).trim();
      if(m.startsWith('cf:'))rec.custom[m.slice(3)]=val;else rec[m]=val;
    });
    if(!rec.tag&&!rec.user){skipped++;return;}
    if(rec.siteCode){
      const hit=siteByName[rec.siteCode.toLowerCase()];
      if(hit)rec.siteCode=hit;
      else{
        let code=rec.siteCode.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'NEW';
        let n=1;while(S.sites.some(s=>s.code===code&&s.name.toLowerCase()!==rec.siteCode.toLowerCase()))code=code.slice(0,2)+(++n);
        if(!S.sites.some(s=>s.code===code))S.sites.push({id:uid('s'),code,name:rec.siteCode,location:'',companyId:S.companies[0].id});
        siteByName[rec.siteCode.toLowerCase()]=code;rec.siteCode=code;
      }
    }else rec.siteCode=defSite;
    if(rec.dept){
      const known=S.depts.find(d=>d.name.toLowerCase()===rec.dept.toLowerCase());
      if(known)rec.dept=known.name;else S.depts.push({id:uid('d'),name:rec.dept});
    }else rec.dept='Unassigned';
    if(!S.depts.some(d=>d.name==='Unassigned'))S.depts.push({id:uid('d'),name:'Unassigned'});
    if(rec.status){
      const st=STATUSES.find(s=>s.toLowerCase()===rec.status.toLowerCase());
      rec.status=st||'In use';
    }
    if(rec.purchasePrice!==undefined)rec.purchasePrice=parsePrice(rec.purchasePrice);
    if(rec.purchaseYear!==undefined){
      const y=+String(rec.purchaseYear).replace(/\D/g,'').slice(0,4);
      rec.purchaseYear=(y>=1990&&y<=YEAR+1)?y:YEAR;
    }
    const ex=rec.tag?S.assets.find(a=>a.tag.toLowerCase()===rec.tag.toLowerCase()):null;
    if(ex){
      Object.keys(rec).forEach(k=>{
        if(k==='custom')Object.assign(ex.custom=ex.custom||{},rec.custom);
        else if(k==='purchasePrice'){ if(rec.purchasePrice!==null)ex.purchasePrice=rec.purchasePrice; }
        else if(rec[k]!==''&&rec[k]!==undefined)ex[k]=rec[k];
      });
      updated++;
    }else{
      S.assets.unshift({id:uid('a'),tag:rec.tag||nextTag(rec.siteCode),serial:rec.serial||'',type:rec.type||'Desktop',
        brand:rec.brand||'Unbranded',model:rec.model||'',user:rec.user||'Unassigned',dept:rec.dept,siteCode:rec.siteCode,
        cpu:rec.cpu||'',ram:rec.ram||'',storage:rec.storage||'',os:rec.os||'',status:rec.status||'In use',
        vendor:rec.vendor||'',purchasePrice:rec.purchasePrice==null?null:rec.purchasePrice,
        purchaseYear:rec.purchaseYear||YEAR,warrantyEnd:rec.warrantyEnd||'',custom:rec.custom,files:[]});
      created++;
    }
  });
  return {created,updated,skipped};
}

         [v,x.n,x.priced,money(x.amt||null),x.priced?money(x.amt/x.priced):'\u2014'])};}},
  {id:'spendsite',t:'Spend by site',d:'Where the money went across locations.',
   run:A=>{const m={};A.forEach(a=>{m[a.siteCode]=m[a.siteCode]||{n:0,amt:0,priced:0};
     m[a.siteCode].n++;if(a.purchasePrice!=null){m[a.siteCode].amt+=a.purchasePrice;m[a.siteCode].priced++;}});
     return{head:['Site','Assets','With a price','Total spend'],
       rows:Object.entries(m).sort((a,b)=>b[1].amt-a[1].amt).map(([c,x])=>
         [siteName(c),x.n,x.priced,money(x.amt||null)])};}},

async function boot(){

/* ============================================================================
   Theme settings — admin-editable colours, typography and company logo.

   The functions in TAPI stand in for the Express endpoints in routes/admin.js.
   They keep the real contract: same status codes, same { error: { code, message,
   fields } } shape, and the same ordering on replace — commit the settings
   record first, delete the superseded file only afterwards.
   ========================================================================== */

const LATENCY = 320;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** Resolves /uploads/<name> against the in-register file store, as express.static would. */
function logoSrc(l){
  if(!l) return null;
  const f = S.files[l.filename];
  return f ? f.dataUrl : null;
}

/* ---- request log, so the status codes are visible ---- */
function rlog(method, path, status, note){
  RLOG.unshift({ t:new Date().toLocaleTimeString('en-GB'), method, path, status, note });
  if(RLOG.length > 30) RLOG.length = 30;
  const el = document.getElementById('rlog');
  if(el) el.innerHTML = renderRlog();
}
function renderRlog(){
  if(!RLOG.length) return '<span class="dim">No requests yet.</span>';
  return RLOG.map(l =>
    `<div><span class="dim">${l.t}</span> <span class="m">${l.method}</span> ${esc(l.path)} ` +
    `<span class="${l.status < 300 ? 'ok' : 'no'}">${l.status}</span>` +
    `${l.note ? ` <span class="dim">${esc(l.note)}</span>` : ''}</div>`
  ).join('');
}

function apiError(status, code, message, fields){
  const e = new Error(message);
  e.status = status; e.code = code; e.fields = fields || null;
  return e;
}
/** Mirrors requireAdmin: 403 for a signed-in non-admin. */
function themeGate(method, path){
  if(!can('admin')){
    rlog(method, path, 403, 'FORBIDDEN');
    throw apiError(403, 'FORBIDDEN', 'Administrator access required.');
  }
}

const TAPI = {
  /** PUT /api/admin/theme — partial payloads merge onto the stored theme. */
  async putTheme(patch){
    await sleep(LATENCY);
    themeGate('PUT', '/api/admin/theme');
    const { valid, errors, value, warnings } = validateTheme(patch, S.theme);
    if(!valid){
      rlog('PUT', '/api/admin/theme', 422, 'VALIDATION_FAILED ' + Object.keys(errors).join(','));
      throw apiError(422, 'VALIDATION_FAILED', 'One or more values are invalid.', errors);
    }
    S.theme = value;
    logit('Theme updated', `${value.primaryColor}, ${value.fontFamily}, ${value.fontSize}px`);
    await save();
    rlog('PUT', '/api/admin/theme', 200, warnings.length ? 'saved with warning' : 'saved');
    return { theme:value, cssVars:themeToCssVars(value), warnings };
  },

  /** POST /api/admin/theme/reset — logoAction is required, never inferred. */
  async resetTheme(logoAction){
    await sleep(LATENCY);
    themeGate('POST', '/api/admin/theme/reset');
    if(!['keep','delete'].includes(logoAction)){
      rlog('POST', '/api/admin/theme/reset', 400, 'LOGO_ACTION_REQUIRED');
      throw apiError(400, 'LOGO_ACTION_REQUIRED', 'Specify logoAction: "keep" or "delete".');
    }
    const existing = S.logo;
    S.theme = { ...DEFAULT_THEME };
    if(logoAction === 'delete' && existing){
      S.logo = null;
      await save();                       // commit
      delete S.files[existing.filename];  // then remove the file
      await save();
      logit('Theme reset', 'defaults restored, logo deleted');
      rlog('POST', '/api/admin/theme/reset', 200, 'defaults restored, logo deleted');
      return { theme:S.theme, logo:null, logoDeleted:true };
    }
    await save();
    logit('Theme reset', 'defaults restored, logo kept');
    rlog('POST', '/api/admin/theme/reset', 200, 'defaults restored, logo kept');
    return { theme:S.theme, logo:existing, logoDeleted:false };
  },

  /**
   * POST /api/admin/logo (multipart)
   * Mirrors the server: multer mimetype filter, magic-byte sniffing, structural
   * completeness check, SVG sanitisation, then a content-hash filename.
   */
  async postLogo(file){
    await sleep(LATENCY + 160);
    const P = '/api/admin/logo';
    themeGate('POST', P);

    if(!ALLOWED_MIME[String(file.type).toLowerCase()]){
      rlog('POST', P, 415, 'UNSUPPORTED_TYPE (mimetype)');
      throw apiError(415, 'UNSUPPORTED_TYPE', 'Only PNG, JPG and SVG files are accepted.');
    }
    if(file.size > MAX_LOGO_BYTES){
      rlog('POST', P, 413, 'FILE_TOO_LARGE');
      throw apiError(413, 'FILE_TOO_LARGE', 'Logo must be 2 MB or smaller.');
    }
    const buf = new Uint8Array(await file.arrayBuffer());
    if(buf.length === 0){
      rlog('POST', P, 422, 'EMPTY_FILE');
      throw apiError(422, 'EMPTY_FILE', 'The uploaded file is empty.');
    }
    const format = sniffFormat(buf);
    if(!format){
      rlog('POST', P, 415, 'UNSUPPORTED_TYPE (magic bytes)');
      throw apiError(415, 'UNSUPPORTED_TYPE', 'Only PNG, JPG and SVG files are accepted.');
    }
    if(!looksComplete(buf, format)){
      rlog('POST', P, 422, 'CORRUPT_FILE');
      throw apiError(422, 'CORRUPT_FILE', 'The image file appears to be truncated or corrupt.');
    }

    let bytes = buf, stripped = 0;
    if(format === 'svg'){
      const raw = new TextDecoder().decode(buf);
      const clean = sanitizeSvg(raw);
      stripped = raw.length - clean.length;
      bytes = new TextEncoder().encode(clean);
    }
    const hash = sha256Hex(bytes);
    const filename = `logo-${hash.slice(0,32)}${ALLOWED_EXT[format]}`;

    const deduped = Object.prototype.hasOwnProperty.call(S.files, filename);
    if(!deduped){
      const mime = format === 'svg' ? 'image/svg+xml' : format === 'png' ? 'image/png' : 'image/jpeg';
      let bin = '';
      for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      S.files[filename] = { dataUrl:`data:${mime};base64,${btoa(bin)}`, bytes:bytes.length, format };
    }
    const previous = S.logo;
    S.logo = { filename, format, bytes:bytes.length, sha256:hash,
               url:`/uploads/${filename}`, uploadedAt:new Date().toISOString() };
    logit('Logo uploaded', filename + (deduped ? ' (already stored)' : ''));
    await save();                                       // commit
    if(previous && previous.filename !== filename){     // then delete the old file
      delete S.files[previous.filename];
      await save();
    }
    const note = (deduped ? 'deduplicated' : 'stored') +
                 (stripped > 0 ? `, ${stripped} bytes of active content stripped` : '');
    rlog('POST', P, 201, note);
    return { logo:S.logo, replaced:Boolean(previous), deduplicated:deduped, sanitizedBytes:stripped };
  },

  /** DELETE /api/admin/logo */
  async deleteLogo(){
    await sleep(LATENCY);
    themeGate('DELETE', '/api/admin/logo');
    if(!S.logo){
      rlog('DELETE', '/api/admin/logo', 404, 'NO_LOGO');
      throw apiError(404, 'NO_LOGO', 'There is no logo to remove.');
    }
    const f = S.logo.filename;
    S.logo = null;
    logit('Logo removed', f);
    await save();
    delete S.files[f];
    await save();
    rlog('DELETE', '/api/admin/logo', 200, 'removed');
    return { logo:null, deleted:true };
  }
};

/** Keeps Save and the unsaved-changes hint current during uninterrupted typing. */
function refreshDirty(){
  const btn = document.getElementById('tsave');
  if(!btn) return;
  btn.disabled = TST.saving || !tdirty();
  const row = btn.parentElement, hint = row.querySelector('.dirty');
  if(tdirty() && !hint){
    const s = document.createElement('span');
    s.className = 'dirty'; s.textContent = 'Unsaved changes';
    row.appendChild(s);
  } else if(!tdirty() && hint) hint.remove();
}
function tset(k, v){ TDRAFT[k] = v; TST.success = null; render(); }

async function doThemeSave(){
  const check = validateTheme(TDRAFT, TSAVED);
  if(!check.valid){ TERR = check.errors; render(); return; }
  TERR = {}; TST = { saving:true, error:null, success:null }; render();
  try{
    const res = await TAPI.putTheme(TDRAFT);
    TDRAFT = { ...res.theme }; TSAVED = { ...res.theme };
    applyTheme(res.theme);                                  // now repaint the app
    TST = { saving:false, error:null,
            success: res.warnings.length ? 'Theme saved. ' + res.warnings.join(' ') : 'Theme saved.' };
  }catch(err){
    TERR = err.fields || {};
    TST = { saving:false, error:err.message, success:null };
  }
  render();
}

/* ============================================================================
   Upload tests — a diagnostics harness, not a product feature.

   Each button builds a real file in memory and sends it through the same
   validation path a genuine upload takes, so the rejections below are produced
   by the code that runs in production, not by a mock.
   ========================================================================== */

let CRCT = null;
/** CRC32, needed to build a genuinely valid PNG rather than a stub. */
function crc32(bytes){
  if(!CRCT){
    CRCT = new Int32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      CRCT[n] = c;
    }
  }
  let c = 0xffffffff;
  for(let i = 0; i < bytes.length; i++) c = CRCT[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function adler32(d){
  let a = 1, b = 0;
  for(let i = 0; i < d.length; i++){ a = (a + d[i]) % 65521; b = (b + a) % 65521; }
  return (b << 16 | a) >>> 0;
}
/** Builds a 1x1 PNG with a stored (uncompressed) zlib stream — valid, no deflate needed. */
function makePng(r, g, b){
  const cat = (...a) => {
    const t = new Uint8Array(a.reduce((n, x) => n + x.length, 0));
    let o = 0;
    for(const x of a){ t.set(x, o); o += x.length; }
    return t;
  };
  const u32 = n => new Uint8Array([n >>> 24 & 255, n >>> 16 & 255, n >>> 8 & 255, n & 255]);
  const chunk = (type, data) => {
    const body = cat(new TextEncoder().encode(type), data);
    return cat(u32(data.length), body, u32(crc32(body)));
  };
  const ihdr = new Uint8Array(13);
  ihdr.set(u32(1), 0); ihdr.set(u32(1), 4);
  ihdr[8] = 8; ihdr[9] = 2;
  const raw = new Uint8Array([0, r, g, b]);
  const len = raw.length;
  const z = cat(new Uint8Array([0x78, 0x01, 0x01, len & 255, len >> 8 & 255, ~len & 255, (~len >> 8) & 255]),
                raw, u32(adler32(raw)));
  return cat(new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]),
             chunk('IHDR', ihdr), chunk('IDAT', z), chunk('IEND', new Uint8Array(0)));
}
const mkFile = (bytes, name, type) => new File([bytes], name, { type });
const enc = s => new TextEncoder().encode(s);

          <p class="note" style="margin-bottom:12px">This page is a diagnostics harness rather than a feature an administrator would normally see. Each button builds a real file in memory and pushes it through the same checks the upload endpoint runs: mimetype filter, magic-byte sniffing, structural completeness, SVG sanitisation, content hashing. Successful uploads change the logo across the whole register.</p>
          <div class="tests">
            ${UPLOAD_CASES.map(c => `<button class="btn" data-case="${c.id}"><strong>${esc(c.label)}</strong><br><span style="color:var(--muted)">${esc(c.note)}</span></button>`).join('')}
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <header><h2>Theme validation</h2></header>
        <div class="in"><div class="tests">
          ${Object.entries(THEME_CASES).map(([k, c]) => `<button class="btn" data-tcase="${k}"><strong>${esc(c.label)}</strong><br><span style="color:var(--muted)">${esc(c.note)}</span></button>`).join('')}
        </div></div>
      </div>
    </div>

    <div class="tsticky">
      <div class="card">
        <header><h2>Results</h2>${TRESULTS.length ? '<button class="btn sm" id="tclr" style="margin-left:auto">Clear</button>' : ''}</header>
        <div class="in" id="tres">
          ${TRESULTS.length ? TRESULTS.map(r => `
            <div style="border-bottom:1px solid var(--line2);padding:9px 0">
              <div class="row" style="gap:8px;align-items:baseline">
                <span class="mono" style="color:${r.status < 300 ? 'var(--moss)' : 'var(--oxide)'};font-weight:500">${r.status}</span>
                <strong style="font-size:13px">${esc(r.label)}</strong>
              </div>
              <div style="color:var(--muted);font-size:12.5px;margin-top:3px">${esc(r.detail)}</div>
              ${r.extra ? `<div class="mono" style="font-size:11.5px;margin-top:4px;color:var(--muted);word-break:break-all">${esc(r.extra)}</div>` : ''}
            </div>`).join('') : '<p class="note">No tests run yet.</p>'}
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <header><h2>Request log</h2></header>
        <div class="in"><div class="rlog" id="rlog">${renderRlog()}</div></div>
      </div>
    </div>
  </div>`;

  v.querySelectorAll('[data-case]').forEach(b => b.onclick = () => runUploadCase(b.dataset.case));
  v.querySelectorAll('[data-tcase]').forEach(b => b.onclick = () => runThemeCase(b.dataset.tcase));
  const c = document.getElementById('tclr');
  if(c) c.onclick = () => { TRESULTS = []; render(); };
}

function pushResult(r){
  TRESULTS.unshift(r);
  if(TRESULTS.length > 20) TRESULTS.length = 20;
}

async function runUploadCase(id){
  const c = UPLOAD_CASES.find(x => x.id === id);
  try{
    const res = await TAPI.postLogo(c.make());
    let detail = res.deduplicated
      ? 'Accepted — those exact bytes were already stored, so no second file was written.'
      : 'Accepted and stored.';
    if(res.replaced && !res.deduplicated) detail += ' The previous file was deleted after the settings commit.';
    if(res.sanitizedBytes > 0) detail += ` ${res.sanitizedBytes} bytes of active content were stripped.`;
    pushResult({ status:201, label:c.label, detail, extra:res.logo.filename });
  }catch(err){
    pushResult({ status:err.status || 500, label:c.label, detail:err.message, extra:err.code });
  }
  render();
}

async function runThemeCase(kind){
  const c = THEME_CASES[kind];
  try{
    const res = await TAPI.putTheme(c.payload);
    TDRAFT = { ...res.theme }; TSAVED = { ...res.theme };
    applyTheme(res.theme);
    pushResult({ status:200, label:c.label,
      detail:'Accepted. The fields the payload omitted kept their stored values.',
      extra:`primaryColor=${res.theme.primaryColor} fontFamily=${res.theme.fontFamily} fontSize=${res.theme.fontSize}` });
  }catch(err){
    pushResult({ status:err.status || 500, label:c.label, detail:err.message,
      extra: err.fields ? Object.entries(err.fields).map(([k, v]) => `${k}: ${v}`).join(' | ') : err.code });
  }
  render();
}

</script>
</body>
