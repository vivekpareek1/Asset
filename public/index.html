<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AssetOps — IT asset management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Theme layer. These six are admin-editable; everything below derives from them
     so a colour change propagates without touching component CSS. */
  --app-primary:#1E5A78; --app-secondary:#2F6B4C; --app-text:#17222E; --app-bg:#ffffff;
  --app-font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  --app-font-size:14px; --app-font-size-sm:12px; --app-font-size-lg:18px;

  /* Fixed chrome. Deliberately not themed: the navigation rail stays legible
     whatever palette an admin picks. */
  --ground:#E7EBEF; --surface2:#F5F7F9;
  --ink:#17222E; --muted:#61717F; --line:#CFD8E0; --line2:#E2E8ED;
  --oxide:#A8442A; --oxide-l:#FAEDE9;
  --moss:#2F6B4C; --moss-l:#EAF3EE;
  --amber:#8A6614; --amber-l:#FBF2DE;
  --r:3px;

  /* Derived from the theme. Static fallbacks come first so a browser without
     color-mix() still renders sensible tints rather than dropping the rule. */
  --surface:#fff;
  --surface:var(--app-bg);
  --blue:#1E5A78;
  --blue:var(--app-primary);
  --blue-d:#164457;
  --blue-d:color-mix(in srgb, var(--app-primary) 82%, #000);
  --blue-l:#E8F0F4;
  --blue-l:color-mix(in srgb, var(--app-primary) 11%, #fff);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--app-text);
  font-family:var(--app-font-family); font-size:var(--app-font-size); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:calc(var(--app-font-size-lg) * 1.16)}
h2{font-size:var(--app-font-size-lg)}
h3{font-size:13px;color:var(--muted);font-weight:600}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{
  width:212px;flex:0 0 212px;background:#12202C;color:#B9C6D1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 16px 14px;border-bottom:1px solid #22333F}
.brand b{color:#fff;font-size:16px;display:block;letter-spacing:-.02em}
.brand img{max-height:26px;max-width:120px;object-fit:contain;display:block;margin-bottom:6px}
.brand span{font-size:11px;color:#7E8FA0;font-family:"IBM Plex Mono",monospace}
.nav{padding:8px 0;overflow-y:auto;flex:1}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:7px 16px;cursor:pointer;color:#B9C6D1;font-size:13.5px;border-left:2px solid transparent;
}
.nav button:hover{background:#1A2A38;color:#fff}
.nav button.on{background:#1A2A38;color:#fff;border-left-color:var(--blue);font-weight:500}
.nav .grp{padding:14px 16px 5px;font-size:11px;color:#6C7E8E;font-weight:500}
.nav .ct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#728496}
.railfoot{padding:10px 16px;border-top:1px solid #22333F;font-size:11px;color:#6C7E8E}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
}
.top .who{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.body{padding:20px 22px 60px;flex:1}

/* controls */
.btn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;
}
.btn:hover{border-color:#A9B7C3;background:var(--surface2)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.p:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.d{color:var(--oxide);border-color:#DFC3BA}
.btn.d:hover{background:var(--oxide-l);border-color:var(--oxide)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;width:100%;
}
textarea{resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
label.f > span i{color:var(--oxide);font-style:normal}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card > header{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card > .in{padding:14px}
.grid{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* table */
.tw{overflow:auto;max-height:none}
table{border-collapse:collapse;width:100%;font-size:var(--app-font-size-sm)}
th{
  text-align:left;font-weight:600;font-size:var(--app-font-size-sm);color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);
  position:sticky;top:0;white-space:nowrap;
}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:#F7F9FB}
tbody tr.sel{background:var(--blue-l)}
tbody tr.sel:hover{background:#DFEAF0}
td.chk,th.chk{width:32px;padding-left:12px}
.trunc{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* pills */
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.use{background:var(--moss-l);color:var(--moss)}
.pill.rep{background:var(--oxide-l);color:var(--oxide)}
.pill.spare{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.repair{background:var(--amber-l);color:var(--amber)}
.pill.retired{background:#EDEFF1;color:#7A8894}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:calc(var(--app-font-size) * 1.8);font-weight:500;letter-spacing:-.03em;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--oxide)}

/* age spine — the one bold element */
.spine{display:flex;height:52px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.spine div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#fff;min-width:0;position:relative}
.spinelegend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.spinelegend i{width:9px;height:9px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle}

/* bars */
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:9px;font-size:12.5px}
.bar .t{background:var(--blue);height:15px;border-radius:2px;min-width:2px}
.bar .n{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--muted)}

/* bulk bar */
.bulk{
  position:sticky;bottom:0;z-index:15;background:#12202C;color:#fff;
  padding:9px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-radius:var(--r);margin-top:-1px;
}
.bulk b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.bulk .btn{background:#22333F;color:#fff;border-color:#2E4150}
.bulk .btn:hover{background:#2C404E}
.bulk select{background:#22333F;border-color:#2E4150;color:#fff;width:auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(18,32,44,.42);z-index:40}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--surface);z-index:41;
  display:flex;flex-direction:column;border-left:1px solid var(--line);
}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .in{padding:18px;overflow-y:auto;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .16s ease-out}@keyframes sl{from{transform:translateX(14px);opacity:.6}}}

/* misc */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#12202C;color:#fff;padding:9px 16px;border-radius:var(--r);z-index:60;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer;color:var(--muted);font-size:13.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:500}
.kv{display:grid;grid-template-columns:132px 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:2px 9px;font-size:12px}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 0 0 4px}
@media(max-width:820px){
  .rail{position:fixed;left:-212px;z-index:50;transition:left .16s}
  .rail.open{left:0}
  .shell{display:block}
  .g2{grid-template-columns:1fr}
  .body{padding:14px}
}
@media print{.rail,.top,.bulk,.noprint{display:none!important}.body{padding:0}}

/* ---- theme settings page ---- */
.tcols{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.tcols{grid-template-columns:1fr}}
.tsticky{position:sticky;top:62px}
fieldset{border:0;padding:0;margin:0 0 18px}
fieldset:disabled{opacity:.6}
legend{font-size:12px;font-weight:600;color:var(--muted);padding:0 0 8px}
.colrow{display:flex;gap:7px;align-items:center}
.colrow input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;flex:0 0 38px}
.ferr{display:block;color:var(--oxide);font-size:12px;font-style:normal;margin-top:3px}
input[aria-invalid=true]{border-color:var(--oxide);background:var(--oxide-l)}
.twarn{background:var(--amber-l);border:1px solid #E6D4A8;color:var(--amber);border-radius:var(--r);padding:8px 10px;font-size:12.5px;margin:0 0 12px}
.alert{border-radius:var(--r);padding:9px 12px;font-size:13px;margin-bottom:14px}
.alert.e{background:var(--oxide-l);border:1px solid #DFC3BA;color:var(--oxide)}
.alert.k{background:var(--moss-l);border:1px solid #B9D7C6;color:var(--moss)}
.stage{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--app-bg);color:var(--app-text);font-family:var(--app-font-family);font-size:var(--app-font-size)}
.stage h3{font-size:var(--app-font-size-lg);margin:0 0 8px}
.stage p{margin:0 0 12px;max-width:56ch}
.stage .pbtn{background:var(--app-primary);color:#fff;border:0;padding:7px 14px;border-radius:var(--r);font-size:var(--app-font-size-sm);cursor:default}
.stage .sec{color:var(--app-secondary);margin-left:12px;font-size:var(--app-font-size-sm);font-weight:500}
.stage table{margin-top:14px}
.stage .lg{max-height:34px;max-width:150px;object-fit:contain;margin-bottom:12px;display:block}
.drop{border:1px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;background:var(--surface2)}
.drop.over{border-color:var(--blue);background:var(--blue-l)}
.logobox{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface2);margin-bottom:10px}
.logobox img{max-height:44px;max-width:130px;object-fit:contain}
.logobox .meta{font-size:12px;color:var(--muted);line-height:1.5}
.logobox.pending{border-color:var(--amber);background:var(--amber-l)}
.rlog{background:#12202C;color:#C7D3DD;border-radius:var(--r);padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;max-height:210px;overflow:auto;line-height:1.7}
.rlog .m{color:#7FB3CC;font-weight:500}
.rlog .ok{color:#7CC79B}
.rlog .no{color:#E39B86}
.rlog .dim{color:#68798A}
.modal{position:fixed;inset:0;background:rgba(18,32,44,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:#fff;border-radius:4px;max-width:480px;padding:20px}
.modal p{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.55}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.dirty{font-size:12px;color:var(--amber);align-self:center}
.tests{display:grid;gap:6px}
.tests button{text-align:left;font-size:12.5px;padding:7px 10px;line-height:1.45}

/* ---- sign in ---- */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--ground)}
.logincard{background:#fff;border:1px solid var(--line);border-radius:4px;padding:26px;width:min(370px,100%)}
.logincard h1{font-size:21px;margin-bottom:2px}
.logincard .sub{color:var(--muted);font-size:13px;margin:0 0 20px;font-family:"IBM Plex Mono",monospace}
.logincard input{width:100%}
.logincard .hint{color:var(--muted);font-size:12px;margin:14px 0 0;line-height:1.5}
.who button{margin-left:2px}
.kv dt{color:var(--muted)}
</style>

<script>
/* ============================================================================
   Section 1 — src/shared/themeSchema.js, verbatim (module syntax removed).
   Same code the Express routes use. Client and server cannot disagree.
   ========================================================================== */
const FONT_SIZE_MIN=12, FONT_SIZE_MAX=32;
const FONT_FAMILIES=[
  {id:'system',label:'System UI',stack:'system-ui, -apple-system, "Segoe UI", sans-serif',google:null},
  {id:'inter',label:'Inter',stack:'"Inter", system-ui, sans-serif',google:'Inter:wght@400;500;600;700'},
  {id:'plex-sans',label:'IBM Plex Sans',stack:'"IBM Plex Sans", system-ui, sans-serif',google:'IBM+Plex+Sans:wght@400;500;600;700'},
  {id:'source-sans',label:'Source Sans 3',stack:'"Source Sans 3", system-ui, sans-serif',google:'Source+Sans+3:wght@400;500;600;700'},
  {id:'roboto',label:'Roboto',stack:'"Roboto", system-ui, sans-serif',google:'Roboto:wght@400;500;700'},
  {id:'lora',label:'Lora',stack:'"Lora", Georgia, serif',google:'Lora:wght@400;500;600'},
  {id:'georgia',label:'Georgia',stack:'Georgia, "Times New Roman", serif',google:null}
];
const FONT_FAMILY_IDS=FONT_FAMILIES.map(f=>f.id);
const DEFAULT_THEME=Object.freeze({
  primaryColor:'#1e5a78',secondaryColor:'#2f6b4c',textColor:'#17222e',
  backgroundColor:'#ffffff',fontFamily:'system',fontSize:14
});
const HEX_RE=/^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
const isHexColor=v=>typeof v==='string'&&HEX_RE.test(v.trim());
function normalizeHex(v){const s=String(v).trim().toLowerCase();
  return s.length===4?'#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3]:s;}
function isValidFontSize(v){const n=typeof v==='string'&&v.trim()!==''?Number(v):v;
  return Number.isInteger(n)&&n>=FONT_SIZE_MIN&&n<=FONT_SIZE_MAX;}
const isValidFontFamily=v=>typeof v==='string'&&FONT_FAMILY_IDS.includes(v);
const fontStackFor=id=>(FONT_FAMILIES.find(x=>x.id===id)||FONT_FAMILIES[0]).stack;
function luminance(hex){const h=normalizeHex(hex);
  const ch=[1,3,5].map(i=>{const c=parseInt(h.slice(i,i+2),16)/255;
    return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*ch[0]+0.7152*ch[1]+0.0722*ch[2];}
function contrastRatio(a,b){const l1=luminance(a),l2=luminance(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
function validateTheme(input,base=DEFAULT_THEME){
  const errors={},warnings=[],value={...base};
  if(input===null||typeof input!=='object'||Array.isArray(input))
    return {valid:false,errors:{_:'Body must be a JSON object.'},value,warnings};
  for(const key of ['primaryColor','secondaryColor','textColor','backgroundColor']){
    if(input[key]===undefined)continue;
    if(!isHexColor(input[key]))errors[key]='Must be a hex colour such as #1e5a78.';
    else value[key]=normalizeHex(input[key]);
  }
  if(input.fontFamily!==undefined){
    if(!isValidFontFamily(input.fontFamily))errors.fontFamily=`Must be one of: ${FONT_FAMILY_IDS.join(', ')}.`;
    else value.fontFamily=input.fontFamily;
  }
  if(input.fontSize!==undefined){
    if(!isValidFontSize(input.fontSize))errors.fontSize=`Must be a whole number between ${FONT_SIZE_MIN} and ${FONT_SIZE_MAX}.`;
    else value.fontSize=Number(input.fontSize);
  }
  if(!errors.textColor&&!errors.backgroundColor){
    const r=contrastRatio(value.textColor,value.backgroundColor);
    if(r<4.5)warnings.push(`Text on background is ${r.toFixed(2)}:1, below the WCAG AA minimum of 4.5:1.`);
  }
  return {valid:Object.keys(errors).length===0,errors,value,warnings};
}
function themeToCssVars(t){return{
  '--app-primary':t.primaryColor,'--app-secondary':t.secondaryColor,
  '--app-text':t.textColor,'--app-bg':t.backgroundColor,
  '--app-font-family':fontStackFor(t.fontFamily),'--app-font-size':`${t.fontSize}px`,
  '--app-font-size-sm':`${Math.round(t.fontSize*0.86)}px`,
  '--app-font-size-lg':`${Math.round(t.fontSize*1.28)}px`
};}

/* ============================================================================
   Section 2 — src/admin/applyTheme.js
   ========================================================================== */
const WEBFONT_ID='app-theme-webfont';
function applyTheme(theme,target=document.documentElement){
  const vars=themeToCssVars(theme);
  for(const [n,v] of Object.entries(vars))target.style.setProperty(n,v);
  if(target===document.documentElement)ensureWebfont(theme.fontFamily);
}
function ensureWebfont(id){
  const font=FONT_FAMILIES.find(f=>f.id===id);
  const link=document.getElementById(WEBFONT_ID);
  if(!font||!font.google){if(link)link.remove();return;}
  const href=`https://fonts.googleapis.com/css2?family=${font.google}&display=swap`;
  if(link){if(link.href!==href)link.href=href;return;}
  const el=document.createElement('link');
  el.id=WEBFONT_ID;el.rel='stylesheet';el.href=href;
  document.head.appendChild(el);
}

/* ============================================================================
   Section 3 — logoService.js validation, running in the browser.
   In production this runs on the SERVER; a client-side copy is advisory only.
   The rules below are byte-for-byte the ones the Node service applies.
   ========================================================================== */
const MAX_LOGO_BYTES=2*1024*1024;
const ALLOWED_EXT={png:'.png',jpeg:'.jpg',svg:'.svg'};
const ALLOWED_MIME={'image/png':'png','image/jpeg':'jpeg','image/jpg':'jpeg','image/svg+xml':'svg'};

function sniffFormat(buf){
  if(!buf||buf.length<12)return null;
  if(buf[0]===0x89&&buf[1]===0x50&&buf[2]===0x4e&&buf[3]===0x47&&
     buf[4]===0x0d&&buf[5]===0x0a&&buf[6]===0x1a&&buf[7]===0x0a)return 'png';
  if(buf[0]===0xff&&buf[1]===0xd8&&buf[2]===0xff)return 'jpeg';
  const head=new TextDecoder().decode(buf.subarray(0,2048)).replace(/^\uFEFF/,'').trimStart();
  if(/^<(\?xml|!DOCTYPE svg|svg)[\s>]/i.test(head)&&/<svg[\s>]/i.test(head))return 'svg';
  return null;
}
function looksComplete(buf,format){
  if(format==='png'){
    if(buf.length<=20)return false;
    const t=buf.subarray(buf.length-8);
    const want=[0x49,0x45,0x4e,0x44,0xae,0x42,0x60,0x82];

  dv.setUint32(withPad.length-8, Math.floor(ml/4294967296));

   Client data layer.

   Every mutation is one HTTP call against one record. There is no whole-document
   save any more, so two people working at once no longer overwrite each other.

/** Normalises every failure into an Error carrying code, fields and status. */
async function request(method, path, body){
  let res;
  try{
    res = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
  }catch(networkError){
    const e = new Error('Could not reach the server. Check your connection.');
    e.code = 'OFFLINE';
    throw e;
  }
  let payload = null;
  const text = await res.text();
  try { payload = text ? JSON.parse(text) : null; } catch { /* non-JSON */ }

  if(!res.ok){
    const info = (payload && payload.error) || {};
    const e = new Error(info.message || `Request failed (${res.status})`);
    e.status = res.status;
    e.code = info.code || 'UNKNOWN';
    e.fields = info.fields || null;
    e.current = info.current || null;   // the winning row, on a 409
    throw e;
  }
  return payload;
}

/** Reads a File as bare base64, without the data: prefix the server would strip. */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result);
      resolve(s.slice(s.indexOf(',') + 1));
    };
    r.onerror = () => reject(new Error('That file could not be read.'));
    r.readAsDataURL(file);
  });
}

function csvParse(text){
  const rows=[];let row=[],cur='',q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
function csvCell(v){

            <td class="chk"><input type="checkbox" data-c="${a.id}" ${SEL.has(a.id)?'checked':''} aria-label="Select ${esc(a.tag)}"></td>
            ${C.map(c=>`<td data-open="${a.id}">${c.r(a)}</td>`).join('')}
          </tr>`).join(''):`<tr><td colspan="${C.length+1}"><div class="empty"><b>No assets match these filters</b>Adjust the search or clear the filters to see the full register.</div></td></tr>`}

      <button class="btn sm" id="prev" ${F.page<=1?'disabled':''}>Previous</button>

  const rerender=()=>{const y=window.scrollY;render();window.scrollTo(0,y);};

  });
  $('#all').onchange=e=>{page.forEach(a=>e.target.checked?SEL.add(a.id):SEL.delete(a.id));rerender();};
  v.querySelectorAll('td[data-open]').forEach(td=>td.onclick=()=>openDrawer(td.dataset.open));

  // selection: click, shift-range, drag
  const boxes=[...v.querySelectorAll('input[data-c]')];
  boxes.forEach((b,i)=>{
    b.onclick=ev=>{
      ev.stopPropagation();
      if(ev.shiftKey&&lastIdx>-1){
        const [s,e2]=[Math.min(lastIdx,i),Math.max(lastIdx,i)];
        for(let j=s;j<=e2;j++){b.checked?SEL.add(boxes[j].dataset.c):SEL.delete(boxes[j].dataset.c);}

    };
    b.parentElement.parentElement.onmouseenter=()=>{
      if(!dragging)return;

    };
  });
  drawBulk();

function endDrag(){ if(dragging){dragging=false;document.body.style.userSelect='';} }
document.addEventListener('mouseup',endDrag);

function drawBulk(){
  const bb=document.getElementById('bulkbar');if(!bb)return;
  if(!SEL.size){bb.innerHTML='';return;}
  const editable=can('edit');
  bb.innerHTML=`<div class="bulk noprint">
    <b>${SEL.size} selected</b>
    ${editable?`
    <select id="bs"><option value="">Set status…</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select>
    <select id="bsite"><option value="">Move to site…</option>${S.sites.map(s=>`<option value="${s.code}">${esc(s.name)}</option>`).join('')}</select>
    <select id="bdept"><option value="">Set department…</option>${S.depts.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select>
    <input type="text" id="bvend" placeholder="Set vendor…" style="width:150px;background:#22333F;border-color:#2E4150;color:#fff" list="vendorlist">
    <datalist id="vendorlist">${[...new Set(S.assets.map(a=>a.vendor).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
    <button class="btn sm" id="bvendgo">Apply vendor</button>`:''}
    <button class="btn sm" id="bexp">Export selected</button>
    ${can('admin')?`<button class="btn sm d" id="bdel" style="border-color:#7A3524;color:#F0B9AB">Delete</button>`:''}
    <button class="btn sm" id="bclr" style="margin-left:auto">Clear selection</button>
  </div>`;
  const ids=[...SEL];

  /** One request for the whole selection; the server applies it in a transaction. */
  const apply=async (patch,msg)=>{
    try{
      const r=await API.bulkAssets(ids,patch);
      const b=await API.bootstrap();          // re-read: versions moved on the server
      S.assets=b.assets;
      toast(`${msg} for ${r.changed} of ${ids.length}`);
      if(r.changed<ids.length)toast(`${ids.length-r.changed} skipped — outside your site access`);
    }catch(err){ apiFail(err,'The bulk change failed.'); }
    render();
  };
  if(editable){
    document.getElementById('bs').onchange=e=>e.target.value&&apply({status:e.target.value},'Status set to '+e.target.value);
    document.getElementById('bsite').onchange=e=>e.target.value&&apply({siteCode:e.target.value},'Moved to '+siteName(e.target.value));
    document.getElementById('bdept').onchange=e=>e.target.value&&apply({dept:e.target.value},'Department set to '+e.target.value);
    const bv=document.getElementById('bvend');
    const applyVendor=()=>{const v=bv.value.trim();if(!v)return toast('Type a vendor name first');apply({vendor:v},'Vendor set to '+v);};
    document.getElementById('bvendgo').onclick=applyVendor;
    bv.onkeydown=e=>{if(e.key==='Enter')applyVendor();};
  }
  document.getElementById('bexp').onclick=()=>{exportAssets(S.assets.filter(a=>SEL.has(a.id)),'assets-selected.csv');toast(ids.length+' rows exported');};
  const bd=document.getElementById('bdel');
  if(bd)bd.onclick=async()=>{
    if(!confirm('Delete '+ids.length+' assets from the register? This cannot be undone.'))return;
    let done=0,failed=0;
    for(const id of ids){
      try{ await API.deleteAsset(id); done++; }
      catch(err){ if(handleAuthLoss(err))return; failed++; }
    }
    S.assets=S.assets.filter(a=>!ids.includes(a.id)||failed&&false);
    try{ const b=await API.bootstrap(); S.assets=b.assets; }catch(err){ if(handleAuthLoss(err))return; }
    SEL.clear();render();
    toast(failed?`${done} deleted, ${failed} could not be`:`${done} deleted`);
  };
  document.getElementById('bclr').onclick=()=>{SEL.clear();render();};
}

/* ---------- account security ---------- */
let PWOPEN=false, MFASETUP=null, MFACODES=null;

function passwordModal(){
  const on=ME&&ME.mfaEnabled;
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Account security"><div class="box">
    <h2>Account security</h2>
    <div id="pwerr"></div>

    <h3 style="margin:4px 0 8px">Password</h3>
    <p>At least 10 characters. Changing it signs out your other devices.</p>
    <label class="f"><span>Current password</span><input type="password" id="pwold" autocomplete="current-password"></label>
    <label class="f"><span>New password</span><input type="password" id="pwnew" autocomplete="new-password"></label>
    <div class="row"><button class="btn p" id="pwgo">Change password</button></div>

    <h3 style="margin:20px 0 8px">Two-step sign-in</h3>
    ${MFACODES?`
      <div class="alert k" role="status">Two-step sign-in is on. Save these recovery codes now \u2014 they are shown once and each works a single time.</div>
      <div class="rlog" style="max-height:none">${MFACODES.map(c=>`<div>${esc(c)}</div>`).join('')}</div>
      <div class="row" style="margin-top:9px">
        <button class="btn" id="mfacopy">Copy them</button>
        <button class="btn p" id="mfadone">I have saved them</button>
      </div>`
    : MFASETUP?`
      <p>Add this secret to your authenticator app, then type the code it shows.</p>
      <div class="logobox"><div class="meta"><strong>Secret</strong><br><span class="mono">${esc(MFASETUP.secret)}</span></div></div>
      <p style="word-break:break-all;font-size:11.5px;color:var(--muted)" class="mono">${esc(MFASETUP.uri)}</p>
      <label class="f"><span>Code from the app</span><input type="text" id="mfacode" class="mono" inputmode="numeric" maxlength="6"></label>
      <div class="row"><button class="btn p" id="mfaon">Turn it on</button><button class="btn" id="mfacancel">Cancel</button></div>`
    : on?`
      <p>Two-step sign-in is on. Turning it off needs your password.</p>
      <label class="f"><span>Password</span><input type="password" id="mfapw" autocomplete="current-password"></label>
      <div class="row"><button class="btn d" id="mfaoff">Turn it off</button></div>`
    :`
      <p>Ask for a code from an authenticator app each time you sign in. Strongly recommended for administrators.</p>
      <div class="row"><button class="btn" id="mfastart">Set it up</button></div>`}

    <div class="row" style="margin-top:18px"><button class="btn" id="pwcancel" style="margin-left:auto">Close</button></div>
  </div></div>`;
}

function bindPasswordModal(){
  const box=document.getElementById('pwerr');
  if(!box)return;
  const err=m=>{box.innerHTML=`<div class="alert e" role="alert">${esc(m)}</div>`;};
  const close=()=>{PWOPEN=false;MFASETUP=null;MFACODES=null;render();};
  document.getElementById('pwcancel').onclick=close;

  const go=document.getElementById('pwgo');
  if(go)go.onclick=async()=>{
    go.disabled=true;
    try{
      await API.changePassword(document.getElementById('pwold').value,document.getElementById('pwnew').value);
      if(ME)ME.mustChange=false;
      close();toast('Password changed. Other devices were signed out.');
    }catch(e){ if(handleAuthLoss(e))return; go.disabled=false; err(e.message); }
  };

  const start=document.getElementById('mfastart');
  if(start)start.onclick=async()=>{
    start.disabled=true;
    try{ MFASETUP=await API.mfaSetup(); render(); }
    catch(e){ if(handleAuthLoss(e))return; start.disabled=false; err(e.message); }
  };
  const cancel=document.getElementById('mfacancel');
  if(cancel)cancel.onclick=()=>{MFASETUP=null;render();};

  const on=document.getElementById('mfaon');
  if(on)on.onclick=async()=>{
    on.disabled=true;
    try{
      const r=await API.mfaEnable(document.getElementById('mfacode').value.trim());
      MFACODES=r.backupCodes; MFASETUP=null; ME.mfaEnabled=true; render();
    }catch(e){ if(handleAuthLoss(e))return; on.disabled=false; err(e.message); }
  };

  const copy=document.getElementById('mfacopy');
  if(copy)copy.onclick=()=>{
    const text=MFACODES.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copied'),()=>toast('Copy failed \u2014 select them by hand'));
    else toast('Select the codes and copy them by hand');
  };
  const done=document.getElementById('mfadone');
  if(done)done.onclick=close;

  const off=document.getElementById('mfaoff');
  if(off)off.onclick=async()=>{
    off.disabled=true;
    try{
      await API.mfaDisable(document.getElementById('mfapw').value);
      ME.mfaEnabled=false; MFASETUP=null; MFACODES=null; render(); toast('Two-step sign-in turned off.');
    }catch(e){ if(handleAuthLoss(e))return; off.disabled=false; err(e.message); }
  };
}

      }else{
        a.files.push({name:f.name,size:f.size});
        if(!--pending){save();logit('Attachment recorded',f.name+' on '+a.tag);openDrawer(id);}
      }
    });
  };
  const ds=wrap.querySelector('#dsave');

    const g=k=>wrap.querySelector('#e_'+k).value;
    const patch={version:a.version};
    ['user','dept','status','type','brand','model','serial','cpu','ram','storage','os','warrantyEnd','vendor']
      .forEach(k=>patch[k]=g(k).trim());
    patch.siteCode=g('site');
    patch.purchaseYear=+g('purchaseYear')||a.purchaseYear;
    const rawPrice=g('purchasePrice').trim();
    patch.purchasePrice=rawPrice===''?null:rawPrice;
    const custom={};let missing=null;
    S.fields.forEach(f=>{
      const v=wrap.querySelector('#e_cf_'+f.key).value.trim();
      if(f.required&&!v)missing=f.label;
      custom[f.key]=v;
    });

    patch.custom=custom;
    ds.disabled=true;
    try{
      const r=await API.updateAsset(a.id,patch);
      putLocalAsset(r.asset);
      close();render();toast('Saved '+r.asset.tag);
    }catch(err){
      ds.disabled=false;
      if(handleAuthLoss(err))return;
      if(err.code==='CONFLICT'&&err.current){
        // Someone else got there first. Show what they changed rather than
        // overwriting it; the person decides what to do next.
        putLocalAsset(err.current);
        close();render();
        showConflict(err.current);
        return;
      }
      toast(err.message);
    }
  };
  const dd=wrap.querySelector('#ddel');
  if(dd)dd.onclick=async()=>{
    if(!confirm('Delete '+a.tag+'?'))return;
    try{
      await API.deleteAsset(a.id);

      close();render();toast('Deleted '+a.tag);
    }catch(err){ if(!handleAuthLoss(err))toast(err.message); }
  };
}

/* ---------- import ---------- */
const TARGETS=[
  {k:'tag',t:'Asset tag'},{k:'serial',t:'Serial number'},{k:'type',t:'Type'},{k:'brand',t:'Make'},
  {k:'model',t:'Model'},{k:'user',t:'Assigned to'},{k:'dept',t:'Department'},{k:'siteCode',t:'Site code'},
  {k:'cpu',t:'Processor'},{k:'ram',t:'Memory'},{k:'storage',t:'Storage'},{k:'os',t:'Operating system'},
  {k:'status',t:'Status'},{k:'vendor',t:'Vendor'},{k:'purchasePrice',t:'Purchase price'},
  {k:'purchaseYear',t:'Purchase year'},{k:'warrantyEnd',t:'Warranty end'}
];
function guessMap(h){
  const s=String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  const g={
    tag:['assettag','tag','assetid','assetcode','assetno'],
    serial:['serial','serialnumber','serialno','sno'],
    siteCode:['site','sitename','sitecode','location','branch','office'],
    dept:['dept','department','division'],
    user:['username','user','assignedto','employee','name','owner','custodian'],
    type:['type','assettype','devicetype','desktopaio','category'],
    brand:['make','brand','manufacturer','oem'],
    model:['model','machine','modelno'],
    cpu:['cpu','processor','proc'],
    ram:['ram','memory'],
    storage:['storage','hdd','ssd','harddisk','hddssd','disk','harddrive'],
    os:['os','operatingsystem','windows'],
    status:['status','condition','state'],
    vendor:['vendor','supplier','vendorname','suppliername','purchasedfrom','boughtfrom','dealer','seller','party'],
    purchasePrice:['price','purchaseprice','cost','amount','rate','value','invoiceamount','purchasecost'],
    purchaseYear:['purchaseyear','year','purchased','purchasedate','buyyear'],
    warrantyEnd:['warrantyend','warranty','amcend','expiry','warrantyexpiry']
  };
  // vendor is matched before user: a column headed "supplier name" ends in "name",
  // which would otherwise be read as the person the asset is assigned to.
  const order=['tag','serial','siteCode','dept','vendor','purchasePrice','user','type','brand','model','cpu','ram','storage','os','status','purchaseYear','warrantyEnd'];
  for(const k of order)if(g[k].some(x=>s===x))return k;
  for(const k of order)if(g[k].some(x=>x.length>3&&s.includes(x)))return k;
  return '';
}
function vImport(v){
  if(!can('edit')){v.innerHTML='<div class="empty"><b>Read-only access</b>Your role cannot import data.</div>';return;}
  v.innerHTML=`
  <div class="grid" style="gap:14px;max-width:1000px">
    <div class="card">
      <header><h2>Load a file</h2></header>
      <div class="in">
        <div class="row" style="margin-bottom:10px">
          <input type="file" id="ifile" accept=".csv,.txt,.xlsx,.xls" style="width:auto">
          <span style="color:var(--muted);font-size:12.5px">CSV, or Excel if the reader loads</span>
        </div>
        <label class="f"><span>Or paste rows, first line is the header</span>
          <textarea id="ipaste" rows="6" placeholder="Asset tag,User name,Department,Site,Model,RAM"></textarea></label>
        <button class="btn p" id="iparse">Read rows</button>
      </div>
    </div>
    <div id="imapping"></div>
  </div>`;
  $('#iparse').onclick=()=>{
    const t=$('#ipaste').value.trim();
    if(!t){toast('Paste some rows first, or choose a file');return;}
    stage(csvParse(t));
  };
  $('#ifile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(/\.(xlsx|xls)$/i.test(f.name))return readXlsx(f);
    const r=new FileReader();
    r.onload=()=>stage(csvParse(r.result));
    r.onerror=()=>toast('Could not read that file');
    r.readAsText(f);
  };
  function readXlsx(f){
    const go=()=>{
      const r=new FileReader();
      r.onload=()=>{
        try{
          const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).map(row=>row.map(c=>c==null?'':String(c)));
          stage(rows.filter(row=>row.some(c=>c.trim()!=='')));
        }catch(err){toast('Could not read that workbook');}
      };
      r.readAsArrayBuffer(f);
    };
    if(window.XLSX)return go();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=go;
    s.onerror=()=>toast('Excel reader unavailable. Save the sheet as CSV and try again.');
    document.head.appendChild(s);
  }
  function stage(rows){
    if(rows.length<2){toast('Need a header row and at least one data row');return;}
    IMPORTED={head:rows[0].map(h=>String(h).trim()),rows:rows.slice(1)};
    drawMap();
  }
  function drawMap(){
    const {head,rows}=IMPORTED;
    const auto=head.map(guessMap);
    $('#imapping').innerHTML=`
    <div class="card">
      <header><h2>Match columns</h2><span style="margin-left:auto;color:var(--muted);font-size:12.5px">${rows.length} rows read</span></header>
      <div class="in">
        <div class="g2">
          ${head.map((h,i)=>`<label class="f"><span>${esc(h)||'Column '+(i+1)}</span>
            <select data-map="${i}"><option value="">Ignore this column</option>
            ${TARGETS.map(t=>`<option value="${t.k}" ${auto[i]===t.k?'selected':''}>${t.t}</option>`).join('')}
            ${S.fields.map(f=>`<option value="cf:${f.key}">${esc(f.label)}</option>`).join('')}
            </select></label>`).join('')}
        </div>
        <label class="f" style="max-width:320px"><span>Site for rows with no site column</span>
          <select id="idefsite">${S.sites.map(s=>`<option value="${s.code}">${esc(s.name)}</option>`).join('')}</select></label>
        <div class="note" style="margin-bottom:12px">Rows whose asset tag already exists will update that asset instead of creating a duplicate.</div>
        <h3 style="margin-bottom:6px">Preview</h3>
        <div class="tw" style="max-height:230px;margin-bottom:12px"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${rows.slice(0,5).map(r=>`<tr>${head.map((_,i)=>`<td><span class="trunc">${esc(r[i]||'')}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="row"><button class="btn p" id="idoit">Import ${rows.length} rows</button><button class="btn" id="icancel">Cancel</button></div>
      </div>
    </div>`;
    $('#icancel').onclick=()=>{IMPORTED=null;$('#imapping').innerHTML='';};
    $('#idoit').onclick=doImport;
  }
  async function doImport(){
    const {head,rows}=IMPORTED;
    const map=[...document.querySelectorAll('[data-map]')].map(s=>s.value);
    if(!map.some(m=>m==='user'||m==='tag')){toast('Match at least an asset tag or an assigned-to column');return;}
    const defSite=$('#idefsite').value;
    const btn=$('#idoit');btn.disabled=true;btn.textContent='Importing…';

    // Shape the rows here; the server re-validates every field and applies the
    // whole batch in one transaction.
    const payload=rows.map(r=>{
      const rec={defaultSite:defSite,custom:{}};
      map.forEach((m,i)=>{
        if(!m)return;
        const val=String(r[i]==null?'':r[i]).trim();
        if(m.startsWith('cf:'))rec.custom[m.slice(3)]=val;
        else rec[m]=val;
      });
      return rec;
    });
    try{
      const r=await API.importAssets(payload);
      const b=await API.bootstrap();
      S.assets=b.assets;S.depts=b.depts;
      IMPORTED=null;VIEW='assets';F={...F,q:'',page:1};render();
      toast(`${r.created} added, ${r.updated} updated${r.skipped?`, ${r.skipped} skipped`:''}`);
    }catch(err){
      btn.disabled=false;btn.textContent='Import '+rows.length+' rows';
      if(!handleAuthLoss(err))toast(err.message);
    }
  }
}

/* ---------- reports ---------- */
const REPORTS=[
  {id:'site',t:'Assets by site',d:'Machine count and replacement exposure for each location.',
   run:A=>{const m={};A.forEach(a=>{m[a.siteCode]=m[a.siteCode]||{n:0,rep:0,low:0};m[a.siteCode].n++;if(a.status==='Replace due')m[a.siteCode].rep++;if(ramGB(a)>0&&ramGB(a)<=4)m[a.siteCode].low++;});
     return{head:['Site','Assets','Replace due','4 GB or less'],rows:Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([c,x])=>[siteName(c),x.n,x.rep,x.low])};}},
  {id:'replace',t:'Replacement candidates',d:'Every machine flagged for replacement, oldest first.',
   run:A=>({head:['Asset tag','Site','Assigned to','Processor','Memory','Purchase year'],
     rows:A.filter(a=>a.status==='Replace due').sort((a,b)=>a.purchaseYear-b.purchaseYear).map(a=>[a.tag,siteName(a.siteCode),a.user,a.cpu,a.ram,a.purchaseYear])})},
  {id:'dept',t:'Assets by department',d:'Where the fleet sits across the business.',
   run:A=>{const m={};A.forEach(a=>m[a.dept]=(m[a.dept]||0)+1);
     return{head:['Department','Assets'],rows:Object.entries(m).sort((a,b)=>b[1]-a[1])};}},
  {id:'os',t:'Operating system spread',d:'Useful for patching and licence planning.',
   run:A=>{const m={};A.forEach(a=>m[a.os||'Not recorded']=(m[a.os||'Not recorded']||0)+1);
     return{head:['Operating system','Assets'],rows:Object.entries(m).sort((a,b)=>b[1]-a[1])};}},
  {id:'warr',t:'Warranty expired',d:'Assets past their warranty end date.',
   run:A=>({head:['Asset tag','Site','Assigned to','Make','Warranty end'],
     rows:A.filter(a=>a.warrantyEnd&&new Date(a.warrantyEnd)<new Date()).sort((a,b)=>a.warrantyEnd<b.warrantyEnd?-1:1).map(a=>[a.tag,siteName(a.siteCode),a.user,a.brand,a.warrantyEnd])})},
  {id:'ram',t:'Memory below 8 GB',d:'The upgrade shortlist, cheapest fix before replacement.',
   run:A=>({head:['Asset tag','Site','Assigned to','Memory','Processor'],
     rows:A.filter(a=>ramGB(a)>0&&ramGB(a)<8).sort((a,b)=>ramGB(a)-ramGB(b)).map(a=>[a.tag,siteName(a.siteCode),a.user,a.ram,a.cpu])})},
  {id:'vendor',t:'Spend by vendor',d:'What was bought from whom, and what it cost.',
   run:A=>{const m={};A.forEach(a=>{const v=a.vendor||'Not recorded';m[v]=m[v]||{n:0,amt:0,priced:0};
     m[v].n++;if(a.purchasePrice!=null){m[v].amt+=a.purchasePrice;m[v].priced++;}});
     return{head:['Vendor','Assets','With a price','Total spend','Average'],
       rows:Object.entries(m).sort((a,b)=>b[1].amt-a[1].amt).map(([v,x])=>
         [v,x.n,x.priced,money(x.amt||null),x.priced?money(x.amt/x.priced):'\u2014'])};}},
  {id:'spendsite',t:'Spend by site',d:'Where the money went across locations.',
   run:A=>{const m={};A.forEach(a=>{m[a.siteCode]=m[a.siteCode]||{n:0,amt:0,priced:0};
     m[a.siteCode].n++;if(a.purchasePrice!=null){m[a.siteCode].amt+=a.purchasePrice;m[a.siteCode].priced++;}});
     return{head:['Site','Assets','With a price','Total spend'],
       rows:Object.entries(m).sort((a,b)=>b[1].amt-a[1].amt).map(([c,x])=>
         [siteName(c),x.n,x.priced,money(x.amt||null)])};}},
  {id:'noprice',t:'Missing purchase details',d:'Assets with no vendor or no price on record.',
   run:A=>({head:['Asset tag','Site','Assigned to','Vendor','Purchase price'],
     rows:A.filter(a=>!a.vendor||a.purchasePrice==null).map(a=>
       [a.tag,siteName(a.siteCode),a.user,a.vendor||'Not recorded',money(a.purchasePrice)])})},
  {id:'make',t:'Make and model mix',d:'Manufacturer concentration across the estate.',
   run:A=>{const m={};A.forEach(a=>m[a.brand]=(m[a.brand]||0)+1);
     return{head:['Make','Assets'],rows:Object.entries(m).sort((a,b)=>b[1]-a[1])};}}
];
let RPT='site';
function vReports(v){
  const A=scopedAssets();
  const r=REPORTS.find(x=>x.id===RPT)||REPORTS[0];
  const out=r.run(A);
  v.innerHTML=`
  <div class="tabs noprint">${REPORTS.map(x=>`<button data-r="${x.id}" class="${x.id===RPT?'on':''}">${x.t}</button>`).join('')}</div>
  <div class="card">
    <header><div><h2>${r.t}</h2><span style="color:var(--muted);font-size:12.5px">${r.d}</span></div>
      <button class="btn noprint" id="rcsv" style="margin-left:auto">Export CSV</button>
      <button class="btn noprint" id="rprint">Print</button></header>
    <div class="tw"><table><thead><tr>${out.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${out.rows.length?out.rows.map(row=>`<tr>${row.map((c,i)=>`<td class="${i&&typeof c==='number'?'mono':''}">${esc(c)}</td>`).join('')}</tr>`).join('')
        :`<tr><td colspan="${out.head.length}"><div class="empty"><b>Nothing to report</b>No assets meet this report's criteria right now.</div></td></tr>`}</tbody></table></div>
    <div class="in" style="border-top:1px solid var(--line2);color:var(--muted);font-size:12.5px">${out.rows.length} rows</div>
  </div>`;
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{RPT=b.dataset.r;render();});
  $('#rcsv').onclick=()=>{download(r.id+'-report.csv',[out.head,...out.rows].map(x=>x.map(csvCell).join(',')).join('\n'));toast('Exported');};
  $('#rprint').onclick=()=>window.print();
}

/**
 * Shows a reset token once. There is no mail server here, so the administrator
 * passes it on through a channel they already trust.
 */
function showResetToken(r){
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Reset token"><div class="box">
    <h2>Reset token for ${esc(r.email)}</h2>
    <p>Give this to them through a channel you trust. It works once and expires in an hour. It is shown only now.</p>
    <div class="rlog" style="max-height:none;word-break:break-all">${esc(r.token)}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="rtcopy">Copy</button>
      <button class="btn p" id="rtdone">Done</button>
    </div>
  </div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#rtcopy').onclick=()=>{
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(r.token).then(()=>toast('Copied'),()=>toast('Copy failed'));
    else toast('Select the token and copy it by hand');
  };
  wrap.querySelector('#rtdone').onclick=()=>{wrap.remove();render();};
}

/* ---------- boot ---------- */
async function boot(){
  document.body.innerHTML='<div class="empty" style="padding:80px"><b>Loading the asset register</b>One moment.</div>';
  try{
    await loadState();
    // An account created by an administrator carries a temporary password.
    // Open the security dialog straight away rather than letting it sit unused.
    if(ME&&ME.mustChange){
      PWOPEN=true;
      render();
      toast('This is a temporary password. Please set your own.');
      return;
    }
    render();
  }catch(err){
    if(err&&err.status===401){ renderLogin(); return; }
    document.body.innerHTML=`<div class="empty" style="padding:80px"><b>The register could not start</b>${esc(err.message)}</div>`;
  }
}

async function start(){
  try{
    const r=await API.me();

   The functions in TAPI stand in for the Express endpoints in routes/admin.js.

/** Resolves the logo URL; the server streams the bytes with hardened headers. */
function logoSrc(l){ return l ? l.url : null; }

/* The request log shows what the server actually answered. */
function rlog(method, path, status, note){
  RLOG.unshift({ t:new Date().toLocaleTimeString('en-GB'), method, path, status, note });
  if(RLOG.length > 30) RLOG.length = 30;
  const el = document.getElementById('rlog');
  if(el) el.innerHTML = renderRlog();
}
function renderRlog(){
  if(!RLOG.length) return '<span class="dim">No requests yet.</span>';
  return RLOG.map(l =>
    `<div><span class="dim">${l.t}</span> <span class="m">${l.method}</span> ${esc(l.path)} ` +
    `<span class="${l.status < 300 ? 'ok' : 'no'}">${l.status}</span>` +
    `${l.note ? ` <span class="dim">${esc(l.note)}</span>` : ''}</div>`
  ).join('');
}

/** Wraps an API call so the log records the real status either way. */
async function traced(method, path, fn, noteOk){
  try{
    const out = await fn();
    rlog(method, path, path.includes('/logo') && method === 'POST' ? 201 : 200, noteOk ? noteOk(out) : '');
    return out;
  }catch(err){
    rlog(method, path, err.status || 0, err.code || 'ERROR');
    throw err;
  }
}

let CRCT = null;
/** CRC32, needed to build a genuinely valid PNG rather than a stub. */
function crc32(bytes){
  if(!CRCT){
    CRCT = new Int32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      CRCT[n] = c;
    }
  }
  let c = 0xffffffff;
  for(let i = 0; i < bytes.length; i++) c = CRCT[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function adler32(d){
  let a = 1, b = 0;
  for(let i = 0; i < d.length; i++){ a = (a + d[i]) % 65521; b = (b + a) % 65521; }
  return (b << 16 | a) >>> 0;
}
/** Builds a 1x1 PNG with a stored (uncompressed) zlib stream — valid, no deflate needed. */
function makePng(r, g, b){
  const cat = (...a) => {
    const t = new Uint8Array(a.reduce((n, x) => n + x.length, 0));
    let o = 0;
    for(const x of a){ t.set(x, o); o += x.length; }
    return t;
  };
  const u32 = n => new Uint8Array([n >>> 24 & 255, n >>> 16 & 255, n >>> 8 & 255, n & 255]);
  const chunk = (type, data) => {
    const body = cat(new TextEncoder().encode(type), data);
    return cat(u32(data.length), body, u32(crc32(body)));
  };
  const ihdr = new Uint8Array(13);
  ihdr.set(u32(1), 0); ihdr.set(u32(1), 4);
  ihdr[8] = 8; ihdr[9] = 2;
  const raw = new Uint8Array([0, r, g, b]);
  const len = raw.length;
  const z = cat(new Uint8Array([0x78, 0x01, 0x01, len & 255, len >> 8 & 255, ~len & 255, (~len >> 8) & 255]),
                raw, u32(adler32(raw)));
  return cat(new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]),
             chunk('IHDR', ihdr), chunk('IDAT', z), chunk('IEND', new Uint8Array(0)));
}

    applyTheme(res.theme);
    pushResult({ status:200, label:c.label,
      detail:'Accepted. The fields the payload omitted kept their stored values.',
      extra:`primaryColor=${res.theme.primaryColor} fontFamily=${res.theme.fontFamily} fontSize=${res.theme.fontSize}` });
  }catch(err){
    pushResult({ status:err.status || 500, label:c.label, detail:err.message,
      extra: err.fields ? Object.entries(err.fields).map(([k, v]) => `${k}: ${v}`).join(' | ') : err.code });
  }
  render();
}
</script>
</body>
